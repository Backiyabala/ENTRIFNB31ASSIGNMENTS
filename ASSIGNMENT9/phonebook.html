<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonebook with FetchAPI and Asynchronous Js</title>
    <link href="style.css" rel="stylesheet" type="text/css">
</head>

<body>
    <div class="container">
        <form>
        <input type="hidden" id="contactid" name="id" value="" /><br>
        <label>ContactName</label>
        <input type="text" id="name" name="name" value="" /><br>
        <label>PhoneNumber</label>
        <input type="text" id="phone" name="phone" value="" /><br>
        <label>EmailID</label>
        <input type="text" id="email" name="email" value="" /><br>
        <button onclick="SaveData()">SaveContact</button>
        </form>


        <table border="1">

            <tr>
                <th>Name</th>
                <th>PhoneNumber</th>
                <th>EmailID</th>
                <th>Action</th>
            </tr>

            <tbody id="result">

            </tbody>
        </table>
    </div>
    <script src="script.js"></script>

</body>

</html>
