<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" type="text/css">
</head>

<body>
    <div class="container vh-100 d-flex align-items-center justify-content-center">
        <div class="card shadow-lg p-4 my-4" >
            <div class="text-center mb-4">

                <h4 class="fw-bold">
                    Create Account
                </h4>

                <p class="text-muted fw-light">
                    Sign up to enjoy the Features 
                </p>

            </div>

            <form id="signupForm" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label for="fullName" class="form-label fw-semibold">Full Name</label>
                    <input type="text" class="form-control" id="fullName" placeholder="Enter your full name"
                        minlength="3" maxlength="50" pattern="[A-Za-z ]+" required>
                    <div class="invalid-feedback">Please enter a valid name.</div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="example@gmail.com" required>
                    <div class="invalid-feedback"> Please enter a valid email address.</div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter password"
                            minlength="8" maxlength="20" required>
                        <div class="invalid-feedback">
                            Password must be 8 to 20 characters.
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm password" required>
                        <div class="invalid-feedback">Passwords do not match.</div>
                    </div>
                </div>

                <div class="form-check mb-4">
                    <input type="checkbox" class="form-check-input" id="terms" required>
                    <label class="form-check-label" for="terms">I agree to the Terms and Conditions</label>
                    <div class="invalid-feedback">You must agree before submitting.</div>
                </div>

                <div class="d-grid m-auto">
                    <button type="submit" class="btn btn-primary btn-md">Sign Up</button>
                </div>

            </form>

        </div>
    </div>
     
    

    <script src="js/validation.js"></script>
     
   

</body>

</html>
