<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css" type="text/css">
</head>

<body>
    <div class="container py-3 m-auto">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card todo-card border-0 shadow-sm  bg-success-subtle p-2">
                    <div class="card-header todo-header text-white text-center py-2 border-4 bg-info">
                        <h1 class="fw-bold mb-3"> To-do List </h1>
                    </div>

                    <div class="card-body p-4">
                        <div class="input-group mb-4">
                            <input type="text" id="input-data" class="form-control form-control-lg" placeholder="Type your task....">
                            <button id="btnadd" class="btn p-2">Add Task </button>
                        </div>

                        <div class="filter-container mb-3 text-center">
                            <div class="btn-group w-80">
                                <button id="all" class="btn border rounded btn-warning active">All</button>
                                <button id="pending" class="btn  border rounded btn-danger">Pending</button>
                                <button id="completed" class="btn  border rounded btn-success">Completed</button>
                            </div>
                        </div>

                        <ul id="list" class="list-group"></ul>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="script.js"></script>

</body>

</html>
